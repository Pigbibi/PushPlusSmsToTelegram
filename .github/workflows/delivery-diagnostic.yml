name: Diagnose PushPlus delivery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pushplus-delivery-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_SECRET_KEY: ${{ secrets.PUSHPLUS_SECRET_KEY }}
      PUSHPLUS_WEBHOOK_URL: https://pushplus-sms-to-telegram.pages.dev/pushplus/webhook/${{ secrets.RELAY_TOKEN }}
      PUSHPLUS_VPS_PROBE_URL: ${{ vars.PUSHPLUS_VPS_PROBE_URL || '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Inspect recent PushPlus records without message content
        run: |
          node <<'NODE'
          const { fetchRecentMessages } = require('./src/pushplus');

          async function main() {
            const messages = await fetchRecentMessages({
              token: process.env.PUSHPLUS_TOKEN,
              secretKey: process.env.PUSHPLUS_SECRET_KEY,
              baseUrl: 'https://www.pushplus.plus',
              pageSize: 20,
              titleKeyword: '短信转发',
              bodyKeyword: '',
              lookbackMinutes: 7 * 24 * 60,
            });
            const dayAgo = Date.now() - 24 * 60 * 60 * 1000;
            const summary = {
              matchingRecordsSevenDays: messages.length,
              matchingRecordsTwentyFourHours: messages.filter(message => message.receivedAt >= dayAgo).length,
              latestUpdateTime: messages.at(-1)?.updateTime || null,
              readableDetails: messages.filter(message => message.text.length > 0).length,
              smsMarkerRecords: messages.filter(message => message.text.includes('#SMS')).length,
              senderFieldRecords: messages.filter(message => /发件(?:号码|人|号)?\s*[:：]/.test(message.text)).length,
            };
            console.log(JSON.stringify(summary));
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Probe PushPlus-to-VPS connectivity
        if: env.PUSHPLUS_VPS_PROBE_URL != ''
        continue-on-error: true
        run: |
          node <<'NODE'
          const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
          const webhookCode = 'vps-connectivity-diagnostic';

          async function requestJson(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              signal: AbortSignal.timeout(15_000),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            if (data.code !== 200) throw new Error(`API code ${data.code ?? 'unknown'}`);
            return data;
          }

          async function pushPlusOpen(accessKey, pathname, body) {
            return requestJson(`https://www.pushplus.plus${pathname}`, {
              method: 'POST',
              headers: {
                'access-key': accessKey,
                accept: 'application/json',
                'content-type': 'application/json',
              },
              body: JSON.stringify(body),
            });
          }

          async function waitForResult(accessKey, shortCode) {
            for (let attempt = 1; attempt <= 20; attempt += 1) {
              const result = await requestJson(
                `https://www.pushplus.plus/api/open/message/sendMessageResult?shortCode=${encodeURIComponent(shortCode)}`,
                { headers: { 'access-key': accessKey, accept: 'application/json' } },
              );
              const status = Number(result?.data?.status);
              if (status === 2 || status === 3) return status;
              if (attempt < 20) await sleep(1_000);
            }
            return 0;
          }

          async function main() {
            const access = await requestJson('https://www.pushplus.plus/api/common/openApi/getAccessKey', {
              method: 'POST',
              headers: { accept: 'application/json', 'content-type': 'application/json' },
              body: JSON.stringify({
                token: process.env.PUSHPLUS_TOKEN,
                secretKey: process.env.PUSHPLUS_SECRET_KEY,
              }),
            });
            const accessKey = access?.data?.accessKey;
            if (!accessKey) throw new Error('Missing PushPlus access key');

            const list = await pushPlusOpen(accessKey, '/api/open/webhook/list', { current: 1, pageSize: 50 });
            const existing = (list?.data?.list || []).find(item => item.webhookCode === webhookCode);
            const webhook = {
              webhookCode,
              webhookName: 'VPS连接诊断',
              webhookType: 12,
              webhookUrl: process.env.PUSHPLUS_VPS_PROBE_URL,
              httpMethod: 'GET',
              headers: '',
              body: '',
            };
            if (existing?.id) {
              await pushPlusOpen(accessKey, '/api/open/webhook/edit', { id: existing.id, ...webhook });
            } else {
              await pushPlusOpen(accessKey, '/api/open/webhook/add', webhook);
            }

            let succeeded = 0;
            for (let trial = 1; trial <= 3; trial += 1) {
              const submitted = await requestJson('https://www.pushplus.plus/send', {
                method: 'POST',
                headers: { accept: 'application/json', 'content-type': 'application/json' },
                body: JSON.stringify({
                  token: process.env.PUSHPLUS_TOKEN,
                  title: 'VPS连接诊断',
                  content: `Connectivity trial ${trial}`,
                  channel: 'webhook',
                  option: webhookCode,
                }),
              });
              if (!submitted.data) throw new Error('PushPlus probe did not return a message identifier');
              if (await waitForResult(accessKey, submitted.data) === 2) succeeded += 1;
            }
            console.log(`PushPlus-to-VPS probe succeeded ${succeeded}/3 times.`);
            if (succeeded !== 3) throw new Error('PushPlus-to-VPS connectivity is not reliable enough');
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Send end-to-end message through PushPlus
        id: pushplus_ingress
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

          function setOutput(name, value) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }

          async function requestJson(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              signal: AbortSignal.timeout(15_000),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(`PushPlus HTTP ${response.status}`);
            return data;
          }

          async function main() {
            const submitted = await requestJson('https://www.pushplus.plus/send', {
              method: 'POST',
              headers: { 'content-type': 'application/json', accept: 'application/json' },
              body: JSON.stringify({
                token: process.env.PUSHPLUS_TOKEN,
                title: '短信转发',
                content: [
                  'PushPlus 完整生产链路诊断消息',
                  '发件号码: DIAGNOSTIC-PUSHPLUS',
                  `发件时间: ${new Date().toISOString()}`,
                  '#SMS',
                ].join('\n'),
              }),
            });
            if (submitted.code !== 200 || !submitted.data) {
              throw new Error(`PushPlus rejected the diagnostic request (code ${submitted.code ?? 'unknown'})`);
            }

            const access = await requestJson('https://www.pushplus.plus/api/common/openApi/getAccessKey', {
              method: 'POST',
              headers: { 'content-type': 'application/json', accept: 'application/json' },
              body: JSON.stringify({
                token: process.env.PUSHPLUS_TOKEN,
                secretKey: process.env.PUSHPLUS_SECRET_KEY,
              }),
            });
            const accessKey = access?.data?.accessKey;
            if (access.code !== 200 || !accessKey) throw new Error('Could not obtain a PushPlus access key');

            for (let attempt = 1; attempt <= 20; attempt += 1) {
              const result = await requestJson(
                `https://www.pushplus.plus/api/open/message/sendMessageResult?shortCode=${encodeURIComponent(submitted.data)}`,
                { headers: { accept: 'application/json', 'access-key': accessKey } },
              );
              if (result.code !== 200) {
                throw new Error(`Could not query PushPlus delivery status (code ${result.code ?? 'unknown'})`);
              }
              const status = Number(result?.data?.status);
              if (status === 2) {
                setOutput('delivery_mode', 'realtime');
                console.log('PushPlus accepted the message and completed webhook delivery to Telegram.');
                return;
              }
              if (status === 3) {
                const detail = String(result?.data?.errorMessage || 'no detail returned')
                  .replace(/\/pushplus\/webhook\/[^/?\s]+/gi, '/pushplus/webhook/[redacted]')
                  .replace(/([?&](?:token|key|secret|authorization)=)[^&\s]+/gi, '$1[redacted]')
                  .slice(0, 500);
                setOutput('delivery_mode', 'recovery');
                fs.writeFileSync('.pushplus-diagnostic-source-id', submitted.data, { mode: 0o600 });
                console.warn(`PushPlus realtime webhook failed; waiting for minute recovery: ${detail}`);
                return;
              }
              if (attempt < 20) await sleep(2_000);
            }
            throw new Error('Timed out waiting for PushPlus webhook delivery');
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Verify minute recovery after PushPlus webhook failure
        if: steps.pushplus_ingress.outputs.delivery_mode == 'recovery'
        timeout-minutes: 3
        env:
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

          async function main() {
            const sourceId = fs.readFileSync('.pushplus-diagnostic-source-id', 'utf8').trim();
            if (!sourceId || !process.env.INBOX_TOKEN) throw new Error('Missing recovery diagnostic credentials');
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              const response = await fetch(
                'https://pushplus-sms-to-telegram.pigbibi.workers.dev/diagnostics/handled',
                {
                  method: 'POST',
                  headers: {
                    authorization: `Bearer ${process.env.INBOX_TOKEN}`,
                    'content-type': 'application/json',
                  },
                  body: JSON.stringify({ sourceId }),
                  signal: AbortSignal.timeout(15_000),
                },
              );
              const data = await response.json().catch(() => ({}));
              if (!response.ok) throw new Error(`Recovery diagnostic HTTP ${response.status}`);
              if (data.handled === true) {
                console.log('Minute recovery processed the failed PushPlus webhook message.');
                return;
              }
              if (attempt < 12) await sleep(10_000);
            }
            throw new Error('Minute recovery did not process the failed PushPlus webhook message in time');
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Send production webhook-to-Telegram smoke message
        if: always()
        env:
          TEST_SOURCE_ID: delivery-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node <<'NODE'
          async function main() {
            const response = await fetch(process.env.PUSHPLUS_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                shortCode: process.env.TEST_SOURCE_ID,
                title: '短信转发',
                content: [
                  'PushPlus 到 Telegram 生产链路诊断消息',
                  '发件号码: DIAGNOSTIC',
                  `发件时间: ${new Date().toISOString()}`,
                  '#SMS',
                ].join('\n'),
              }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Production webhook smoke failed: HTTP ${response.status}`);
            const data = JSON.parse(body);
            if (data.code !== 200) throw new Error('Production webhook smoke returned a non-success response');
            console.log('Production webhook accepted the message and Telegram sendMessage succeeded.');
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

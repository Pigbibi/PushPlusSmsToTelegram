name: Forward PushPlus SMS to Telegram

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not send Telegram messages; still updates state for matching messages"
        required: false
        default: "false"

permissions:
  contents: read
  id-token: write

concurrency:
  group: pushplus-sms-to-telegram
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_SECRET_KEY: ${{ secrets.PUSHPLUS_SECRET_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STATE_SECRET: ${{ secrets.STATE_SECRET }}
      PUSHPLUS_PAGE_SIZE: ${{ vars.PUSHPLUS_PAGE_SIZE || '20' }}
      MESSAGE_TITLE_KEYWORD: ${{ vars.MESSAGE_TITLE_KEYWORD || '' }}
      MESSAGE_BODY_KEYWORD: ${{ vars.MESSAGE_BODY_KEYWORD || '' }}
      SMS_INTERCEPT_PRESETS: ${{ vars.SMS_INTERCEPT_PRESETS || '' }}
      SMS_INTERCEPT_RULES: ${{ vars.SMS_INTERCEPT_RULES || '' }}
      TELECOM_SMS_SENDER: ${{ vars.TELECOM_SMS_SENDER || '' }}
      TELECOM_SUCCESS_SMS_SENDER: ${{ vars.TELECOM_SUCCESS_SMS_SENDER || '10000' }}
      TELECOM_CONFIRM_PRODUCT_KEYWORD: ${{ vars.TELECOM_CONFIRM_PRODUCT_KEYWORD || '' }}
      TELECOM_CONFIRM_PLAN_ID: ${{ vars.TELECOM_CONFIRM_PLAN_ID || '' }}
      POLL_LOOKBACK_MINUTES: ${{ vars.POLL_LOOKBACK_MINUTES || '60' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      PRIVATE_STATE_BUCKET: ${{ vars.PRIVATE_STATE_BUCKET }}
      STATE_FILE: .state/forwarded.json

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint

      - name: Authenticate private state storage
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up private state storage client
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Restore forwarded state from private storage
        run: node scripts/private-state.js restore

      - name: Forward messages
        run: npm run forward

      - name: Scan state before storage
        uses: QuantStrategyLab/.github/actions/scan-before-publish@0da4da68433b803cda17d3f84e29875a94a32273
        with:
          path: .state

      - name: Persist forwarded state in private storage
        if: success()
        run: node scripts/private-state.js persist

      - name: Record last success time
        if: success()
        run: |
          printf 'Last success: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_STEP_SUMMARY"
